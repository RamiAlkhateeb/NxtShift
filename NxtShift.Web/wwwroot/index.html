<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>نكست شفت · NxtShift</title>
    <base href="/" />
    <script>
        // GitHub Pages serves the app from /NxtShift/. Keep <base> right for every deep link (and for 404.html).
        (function () {
            var m = location.pathname.match(/^\/nxtshift\//i);
            if (m) document.querySelector("base").setAttribute("href", m[0]);
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Nxt.UI/nxt.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="theme-color" content="#f7f7f9" />
    <meta name="description" content="Punch in with one tap and get reminded to punch out when your work-from-home shift is over." />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NxtShift" />
    <script src="_content/Nxt.UI/nxt.js"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="ns-splash"><img src="icon-192.png" alt="" width="96" height="96" /></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" });</script>
</body>

</html>
